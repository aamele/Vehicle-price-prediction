# Trains the used-car price model in Azure ML.
# Runs on every push to main, or manually from the Actions tab ("Run workflow").
#
# Requires one repository secret:
#   AZURE_CREDENTIALS_AA - JSON output of `az ad sp create-for-rbac ... --json-auth`

name: Train model in Azure ML

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: asrat-mlops
  WORKSPACE: asru-azureml

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_AA }}

      - name: Install Azure ML CLI and set defaults
        run: |
          az extension add -n ml -y
          az configure --defaults group=$RESOURCE_GROUP workspace=$WORKSPACE

      - name: Create compute cluster (if missing)
        run: |
          az ml compute show --name cpu-cluster >/dev/null 2>&1 || \
            az ml compute create --name cpu-cluster --type amlcompute \
              --size Standard_A2_v2 --min-instances 0 --max-instances 2

      - name: Register dataset
        run: az ml data create --file mlops/azureml/train/data.yml --version $(date +%Y%m%d%H%M%S)

      - name: Register environment
        run: az ml environment create --file mlops/azureml/train/train-env.yml --version $(date +%Y%m%d%H%M%S)

      - name: Run training pipeline
        run: az ml job create --file mlops/azureml/train/newpipeline.yml --stream
