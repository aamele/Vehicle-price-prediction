$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: Used Cars Price - Prep, Sweep & Register  # Provide the display name for the pipeline
experiment_name: used-cars-price-pipeline  # Provide the experiment name
description: Read Used_cars.csv, Label-encodes  Segment, Splits train/test, tunes a Random Forest and register the best model  # Provide the description for the pipeline

inputs:
  raw_data:
    type: uri_file
    path: azureml:used-cars-data@latest
  test_train_ratio: 0.2

outputs:
  train_data:
    type: uri_folder  # Specify the type for train_data output
  test_data:
    type: uri_folder  # Specify the type for test_data output
  model_info_output_path:
    type: uri_folder  # Specify the type for model_info_output_path output

settings:
  default_datastore: azureml:workspaceblobstore
  default_compute: azureml:Asrat
  continue_on_step_failure: false

jobs:
  prep_data:
    #name: data-preparation  # Provide the job name
    display_name: data-Preparation  # Provide the display name for the job
    code: ../../../data-science/src
    command: >-
      python prep.py  
      --raw_data ${{inputs.raw_data}} 
      --train_data ${{outputs.train_data}}
      --test_data ${{outputs.test_data}}
      --test_train_ratio ${{inputs.test_train_ratio}}
    environment: azureml:used-cars-train-env@latest
    inputs:
      raw_data: ${{parent.inputs.raw_data}}
      test_train_ratio: ${{parent.inputs.test_train_ratio}}
    outputs:
      train_data: ${{parent.outputs.train_data}}
      test_data: ${{parent.outputs.test_data}}

  sweep_step:
    #name: model training
    display_name: train-hyperparameter-tuning  # Hint: Provide the display name for the job
    type: sweep
    inputs:
      train_data: ${{parent.jobs.prep_data.outputs.train_data}}
      test_data: ${{parent.jobs.prep_data.outputs.test_data}}
    outputs:
      model_output:
        type: mlflow_model
    sampling_algorithm: random  # Specify the sampling algorithm
    trial: ./train.yml  # Refers to a separate command component
    search_space:
      n_estimators:
        type: choice
        values: [10, 20, 30, 50]
      max_depth:
        type: choice  # Specify the type for max_depth
        values: [5,10,15,20]  # Provide the values for max_depth
    objective:
      goal: minimize
      primary_metric: MSE
    limits:
      max_total_trials: 20
      max_concurrent_trials: 10
      timeout: 7200


  register_model:
    #name: register-used-cars-price-model  # Provide the job name
    display_name: register-used-cars-price_model  # Provide the display name for the job
    code: ../../../data-science/src
    command: >-
      python register.py 
      --model_name ${{inputs.model_name}} 
      --model_path ${{inputs.model_path}} 
      --model_info_output_path ${{outputs.model_info_output_path}}
    environment: azureml:used-cars-train-env@latest
    inputs:
      model_name: "used_cars_price_prediction_model"
      model_path: ${{parent.jobs.sweep_step.outputs.model_output}}
    outputs:
      model_info_output_path: ${{parent.outputs.model_info_output_path}}

